<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040507"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>
    <linearGradient id="rain-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3848" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3d5168" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#607b99" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bg)"/>

  <!-- Somber background rain strokes -->
  <g stroke="url(#rain-fade)" stroke-width="1" opacity="0.45">
    <line x1="40" y1="-30" x2="15" y2="110" />
    <line x1="110" y1="0" x2="85" y2="140" />
    <line x1="190" y1="-20" x2="165" y2="120" />
    <line x1="280" y1="10" x2="255" y2="150" />
    <line x1="360" y1="-10" x2="335" y2="130" />
    <line x1="450" y1="20" x2="425" y2="160" />
    <line x1="530" y1="-30" x2="505" y2="110" />
    <line x1="620" y1="10" x2="595" y2="150" />
    <line x1="710" y1="-20" x2="685" y2="120" />
    <line x1="790" y1="0" x2="765" y2="140" />
    <line x1="860" y1="-10" x2="835" y2="130" />

    <line x1="70" y1="100" x2="45" y2="240" />
    <line x1="150" y1="120" x2="125" y2="260" />
    <line x1="230" y1="90" x2="205" y2="230" />
    <line x1="320" y1="110" x2="295" y2="250" />
    <line x1="400" y1="130" x2="375" y2="270" />
    <line x1="490" y1="100" x2="465" y2="240" />
    <line x1="570" y1="120" x2="545" y2="260" />
    <line x1="660" y1="90" x2="635" y2="230" />
    <line x1="740" y1="110" x2="715" y2="250" />
    <line x1="830" y1="130" x2="805" y2="270" />
  </g>

  <!-- Left: Solitary Figure / Umbrella Line Art -->
  <g transform="translate(85, 45)" stroke="#536980" stroke-width="1.1" fill="none" opacity="0.8">
    <!-- Umbrella Canopy -->
    <path d="M 12 75 Q 60 12 108 75" stroke="#758ea8" stroke-width="1.3"/>
    <path d="M 12 75 Q 36 64 60 75 Q 84 64 108 75" stroke="#40556b" stroke-width="0.9"/>
    <!-- Shaft & Hook Handle -->
    <line x1="60" y1="12" x2="60" y2="120" stroke="#758ea8" stroke-width="1.2"/>
    <path d="M 60 120 Q 60 134 50 134 Q 40 134 40 124" stroke="#758ea8" stroke-width="1.2"/>
    <!-- Lonely Falling Droplets -->
    <circle cx="28" cy="50" r="1" fill="#8aa8c7" opacity="0.5"/>
    <circle cx="92" cy="53" r="1" fill="#8aa8c7" opacity="0.5"/>
    <line x1="12" y1="75" x2="7" y2="92" stroke="#536980" stroke-width="0.9" opacity="0.4"/>
    <line x1="108" y1="75" x2="113" y2="92" stroke="#536980" stroke-width="0.9" opacity="0.4"/>
  </g>

  <!-- Divider Line -->
  <line x1="220" y1="50" x2="220" y2="190" stroke="#161f2c" stroke-width="1" />

  <!-- Center Typography: Oppressive & Minimalist -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, monospace">
    <!-- Small technical tag -->
    <text x="250" y="78" fill="#3f5166" font-size="10.5" letter-spacing="3.5">0x00 // ISOLATED IN DEEP SILENCE</text>
    
    <!-- Main Cold Title -->
    <text x="250" y="118" fill="#cdd3dc" font-size="22" font-weight="300" letter-spacing="9">SHENCHUCHU</text>
    
    <!-- Heavy / Somber Mood Line -->
    <text x="250" y="152" fill="#697a8c" font-size="11.5" font-style="italic" letter-spacing="1.2">"In absolute isolation, there is only signal and cold rain."</text>
    
    <!-- Subtitle / Doctrine -->
    <text x="250" y="182" fill="#38495a" font-size="10" letter-spacing="2">low-level systems · dead silence · raw memory · zero vanity</text>
  </g>

  <!-- Outer razor-thin border -->
  <rect x="0.5" y="0.5" width="899" height="239" fill="none" stroke="#131b26" stroke-width="1"/>
</svg>